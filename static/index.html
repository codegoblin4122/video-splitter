<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Splitter Web Client</title>
  <style>
    body {
      margin: 20px;
      font-family: Arial, sans-serif;
      background: white;
      color: black;
    }
    h1, h2, h3 {
      margin-top: 0;
      font-size: 18px;
    }
    input, select, button {
      padding: 6px 8px;
      margin: 4px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    button { cursor: pointer; }
    .section {
      border: 1px solid #ddd;
      padding: 12px;
      margin-bottom: 16px;
    }
    .row { margin-bottom: 8px; }
    .status {
      font-weight: bold;
      margin-top: 6px;
    }
    .small { font-size: 12px; color: gray; }
    .list { margin-top: 8px; }
    .list-item {
      padding: 6px;
      border: 1px solid #ddd;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <h1>Video Splitter Web Client</h1>

  <div class="section">
    <h2>API Settings</h2>
    <label>API Base:</label>
    <input id="apiBase" size="40">
    <button id="saveApi">Save</button>
  </div>

  <div class="section">
    <h2>Authentication</h2>
    <div class="row"><label>Username</label><br><input id="username"></div>
    <div class="row"><label>Password</label><br><input id="password" type="password"></div>
    <button id="loginBtn">Login</button>
    <button id="logoutBtn">Logout</button>
    <div class="status" id="authStatus">Logged out</div>
    <div class="small">Use cognito sign in</div>
  </div>

  <div class="section" id="mfaOpt" style="display:none;">
  <h2>Optional MFA (TOTP)</h2>
  <div id="mfaStep1">
    <button id="startTotpBtn">Start TOTP enrolment</button>
  </div>

  <div id="mfaStep2" style="display:none;">
    <p>Scan this QR with Google/Microsoft Authenticator:</p>
    <img id="mfaQr" alt="TOTP QR" style="border:1px solid #ddd; padding:6px; border-radius:6px;" />
    <p class="small">Or add manually:</p>
    <code id="mfaOtpauth" class="small" style="word-break:break-all;"></code>
    <div style="margin-top:8px;">
      <input id="mfaCode" placeholder="6-digit code" />
      <button id="verifyTotpBtn">Verify & enable</button>
    </div>
    <div id="mfaMsg" class="small"></div>
  </div>
</div>


  <div class="section">
    <h2>Upload Video</h2>
    <input type="file" id="fileInput" accept="video/*">
    <button id="uploadBtn">Upload</button>
    <div id="uploadMsg" class="small"></div>
  </div>

  <div class="section">
    <h2>Your Videos</h2>
    <button id="refreshVideos">Refresh</button>
    <div id="videosList" class="list"></div>
    <div id="vidCount" class="small"></div>
  </div>

  <div class="section" id="videoPanel" style="display:none;">
    <h2>Video Details</h2>
    <video id="videoPlayer" controls width="640" style="display:block; margin-top:8px;"></video>
    <div class="row"><label>Video ID</label><br><input id="videoId" readonly></div>
    <div class="row"><label>Filename</label><br><input id="videoFilename" readonly></div>
    <div class="row"><label>Duration (s)</label><br><input id="videoDuration" readonly></div>

    <h3>Split</h3>
    <label>Mode:</label>
    <select id="splitMode">
      <option value="heavy">Heavy (re-encode)</option>
      <option value="fast">Fast (copy)</option>
    </select>
    <label>Parts:</label>
    <input id="splitParts" type="number" min="2" value="10">
    <button id="splitAsyncBtn">Split (async)</button>
    <button id="splitSyncBtn">Split (sync)</button>
    <div id="jobStatus" class="status">No job</div>
    <button id="pollJobBtn">Poll Job</button>

    <h3>Segments</h3>
    <button id="loadSegments">List Segments</button>
    <div id="segmentsGrid" class="list"></div>
  </div>

    <!-- Admin-only controls -->
  <div id="adminPanel" style="display:none; border:1px solid #eee; padding:10px; margin:12px 0;">
    <b>Admin tools</b>
    <div style="margin-top:6px">
      <button id="reindexBtn">Re-index</button>
      <button id="purgeBtn">Purge all jobs</button>
    </div>
  </div>

  <script>
    // ---------- Config ----------
    const apiBaseInput = document.getElementById('apiBase');
    const DEFAULT_API = (location.origin.includes('localhost')||location.origin.includes('127.0.0.1')) 
      ? 'http://localhost:8000' : location.origin;
    apiBaseInput.value = localStorage.getItem('apiBase') || DEFAULT_API;
    document.getElementById('saveApi').onclick = () => {
      localStorage.setItem('apiBase', apiBaseInput.value.trim());
      alert('Saved API base');
    };
    function apiBase(){ return (localStorage.getItem('apiBase') || DEFAULT_API).replace(/\/$/, ''); }

    // ---------- Auth ----------
    let token = localStorage.getItem('jwt') || '';
    let role = localStorage.getItem('role') || '';
    const authStatus = document.getElementById('authStatus');
    function setAuthStatus(){ authStatus.textContent = token ? `Logged in (${role||'user'})` : 'Logged out'; }
    setAuthStatus();

    document.getElementById('loginBtn').onclick = async () => {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      try {
        const res = await fetch(apiBase()+"/auth/login",{
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({username,password})
        });
        if(!res.ok) throw new Error('Login failed');
        const data = await res.json();
        token = data.token; role = data.role || '';
        localStorage.setItem('jwt', token); localStorage.setItem('role', role);
        setAuthStatus(); alert('Logged in');
      } catch(e){ alert(e.message); }
    };

    document.getElementById('logoutBtn').onclick = () => {
      token=''; role=''; localStorage.removeItem('jwt'); localStorage.removeItem('role');
      setAuthStatus(); alert('Logged out');
    };

    function authHeaders(){ return token ? { 'Authorization': 'Bearer '+token } : {}; }

    // ---------- Upload ----------
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadMsg = document.getElementById('uploadMsg');
    uploadBtn.onclick = async () => {
      const f = document.getElementById('fileInput').files[0];
      if(!f) return alert('Choose a video file');
      const fd = new FormData(); fd.append('file', f, f.name);
      uploadBtn.disabled = true; uploadMsg.textContent = 'Uploading...';
      try{
        const res = await fetch(apiBase()+"/videos/upload",{
          method:'POST', headers: authHeaders(), body: fd
        });
        if(!res.ok) throw new Error('Upload failed ('+res.status+")");
        const data = await res.json();
        uploadMsg.textContent = `Uploaded ${data.filename||f.name} (id: ${data.video_id})`;
        await loadVideos();
      }catch(e){ uploadMsg.textContent = e.message; }
      finally{ uploadBtn.disabled = false; }
    };

    // ---------- Videos ----------
    const videosList = document.getElementById('videosList');
    const vidCount = document.getElementById('vidCount');
    document.getElementById('refreshVideos').onclick = loadVideos;

    async function loadVideos(){
      videosList.textContent = 'Loading...';
      try{
        const res = await fetch(apiBase()+"/videos?page=1&page_size=50",{ headers: authHeaders() });
        if(!res.ok) throw new Error('Failed to load videos');
        const data = await res.json();
        vidCount.textContent = `${data.total||0} video(s)`;
        videosList.innerHTML = '';
        (data.items||data.videos||[]).forEach(v => {
          const el = document.createElement('div'); el.className='list-item';
          el.innerHTML = `<b>${v.filename||'video'}</b><br>
                          id: ${v.video_id}, duration: ${v.duration}s<br>
                          <button data-id="${v.video_id}">Open</button>`;
          el.querySelector('button').onclick = ()=> openVideo(v.video_id);
          videosList.appendChild(el);
        });
      }catch(e){ videosList.textContent = e.message; }
    }

    // ---------- Video Panel ----------
    const videoPanel = document.getElementById('videoPanel');
    const videoIdIn = document.getElementById('videoId');
    const videoFilenameIn = document.getElementById('videoFilename');
    const videoDurationIn = document.getElementById('videoDuration');
    const jobStatus = document.getElementById('jobStatus');

    async function openVideo(id){
      const res = await fetch(apiBase()+`/videos/${id}`, { headers: authHeaders() });
      if (!res.ok) {
        const msg = await res.text();
        alert(`Failed to open video ${id}:\n${msg}`);
        return;
      }
      const v = await res.json();

      videoPanel.style.display = 'block';
      videoIdIn.value       = v.video_id || id;
      videoFilenameIn.value = v.filename || '';
      videoDurationIn.value = (v.duration ?? '');

      const player = document.getElementById('videoPlayer');
      player.removeAttribute('src');
      player.load();
      if (v.source_url) {
        player.src = apiBase() + v.source_url;
        player.load();
      }

      if (typeof listSegments === 'function') {
        await listSegments();
      }
    }

    // ---------- Split ----------
    // save last job id so the Poll button knows which job to ask for
    window._lastJobId = '';

    document.getElementById('splitAsyncBtn').onclick = async () => {
      const id = videoIdIn.value; if(!id) return;
      const mode = document.getElementById('splitMode').value; 
      const parts = parseInt(document.getElementById('splitParts').value||'10',10);
      jobStatus.textContent = 'Queued...';
      try{
        const res = await fetch(apiBase()+`/videos/${id}/split_async?parts=${parts}&mode=${mode}`,{
          method:'POST', headers: authHeaders()
        });
        if(!res.ok) throw new Error('Split async failed');
        const data = await res.json();
        window._lastJobId = data.job_id;                 // <-- save the job id
        jobStatus.textContent = 'Queued';
        pollJob(window._lastJobId,true);                 // <-- poll by job id
      }catch(e){ jobStatus.textContent = e.message; }
    };

    document.getElementById('splitSyncBtn').onclick = async () => {
      const id = videoIdIn.value; if(!id) return;
      const mode = document.getElementById('splitMode').value; 
      const parts = parseInt(document.getElementById('splitParts').value||'10',10);
      jobStatus.textContent = 'Processing...';
      try{
        const res = await fetch(apiBase()+`/videos/${id}/split?parts=${parts}&mode=${mode}`,{
          method:'POST', headers: authHeaders()
        });
        if(!res.ok) throw new Error('Split sync failed');
        const data = await res.json();
        jobStatus.textContent = `Done: ${data.parts} parts`;
        await listSegments();
      }catch(e){ jobStatus.textContent = e.message; }
    };

    // Poll button: uses stored job id
    document.getElementById('pollJobBtn').onclick = () => {
      if (window._lastJobId) pollJob(window._lastJobId,false);
      else alert('No job id yet — run Split (async) first.');
    };

    // Poll by job id (not video id)
    async function pollJob(jobId, auto){
      try{
        const res = await fetch(apiBase()+`/jobs/${jobId}`,{ headers: authHeaders() });
        if(!res.ok) throw new Error('Job not found');
        const j = await res.json();
        jobStatus.textContent = `Status: ${j.status}` + (j.parts?` • parts: ${j.parts}`:'');
        if(j.status==='done'){ await listSegments(); return; }
        if(j.status==='error'){ return; }
        if(auto){ setTimeout(()=>pollJob(jobId,true),2500); }
      }catch(e){ jobStatus.textContent = e.message; }
    }

    // ---------- Segments ----------
    const segmentsGrid = document.getElementById('segmentsGrid');
    document.getElementById('loadSegments').onclick = listSegments;

    function absOrApi(url){
      return /^https?:\/\//i.test(url) ? url : (apiBase()+url);
    }

    async function listSegments(){
      const id = videoIdIn.value; if(!id) return;
      segmentsGrid.textContent = 'Loading segments...';
      try{
        const res = await fetch(apiBase()+`/videos/${id}/segments`,{ headers: authHeaders() });
        if(!res.ok) throw new Error('Failed to list segments');
        const data = await res.json();
        const outputs = data.outputs||[];
        if(outputs.length===0){ segmentsGrid.textContent = 'No segments yet'; return; }
        segmentsGrid.innerHTML='';
        outputs.forEach(group => {
          const title = document.createElement('div'); title.textContent = `Mode: ${group.mode}, Parts: ${group.parts}`;
          segmentsGrid.appendChild(title);
          group.segments.forEach((url, idx) => {
            const div = document.createElement('div'); div.className='list-item';
            const fname = `part_${String(idx).padStart(2,'0')}.mp4`;
            const src = absOrApi(url);

            // inline preview (keeps current style; just an element in the item)
            const vid = document.createElement('video');
            vid.src = src;
            vid.controls = true;
            vid.width = 320;

            const btn = document.createElement('button');
            btn.textContent = 'Download';
            btn.onclick = () => downloadWithAuth(url, fname);

            const label = document.createElement('div');
            label.textContent = fname;

            div.appendChild(label);
            div.appendChild(vid);
            div.appendChild(document.createElement('br'));
            div.appendChild(btn);
            segmentsGrid.appendChild(div);
          });
        });
      }catch(e){ segmentsGrid.textContent = e.message; }
    }

    // Use presigned S3 URLs directly (no apiBase, no auth header)
    async function downloadWithAuth(url, filename){
      try{
        const isAbs = /^https?:\/\//i.test(url);
        const res = await fetch(isAbs ? url : (apiBase()+url), {
          headers: isAbs ? {} : authHeaders()
        });
        if(!res.ok) throw new Error('Download failed');
        const blob = await res.blob();
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=> URL.revokeObjectURL(a.href),1000);
      }catch(e){ alert(e.message); }
    }

     document.getElementById('loginBtn').onclick = async () => {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    try {
      const res = await fetch(apiBase()+"/auth/login", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      if (!res.ok) throw new Error(await res.text());

      const data = await res.json();

      // If Cognito says MFA is required, send the user to the MFA page
      if (data.challenge === "MFA_SETUP" || data.challenge === "SOFTWARE_TOKEN_MFA") {
        // stash username/session so mfa.html can read them if you want to pass via storage
        localStorage.setItem('mfa.username', username);
        localStorage.setItem('mfa.session', data.session || "");
        alert("MFA required. You'll finish sign-in on the MFA page.");
        location.href = "/web/mfa.html";
        return;
      }

      // Normal success: Cognito returns id_token / access_token
      if (data.id_token) {
        token = data.id_token;                         // <-- use the ID token
        localStorage.setItem('jwt', token);            // what your app uses
        // (optional) show something in the UI
        role = "";                                     // you don't get a role from Cognito by default
        setAuthStatus();
        alert('Logged in (Cognito)');
        return;
      }

      throw new Error("Unexpected login response");
    } catch (e) {
      alert('Login error: ' + (e.message || e));
    }
  };

    // Auto-load videos if logged in
    if(token){ loadVideos(); }

    // Show Optional-MFA card if logged in (ID or access token present)
(function initMfaCard(){
  if (localStorage.getItem('jwt') || getAccessToken()) {
    document.getElementById('mfaOpt').style.display = '';
  }
})();

    // --- Access token helper (social.html stored this as 'access_token')
function getAccessToken() {
  return localStorage.getItem('access_token') || localStorage.getItem('oauth_access_token') || '';
}

async function postJSON(path, body){
  const r = await fetch(apiBase()+path, {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body||{})
  });
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

// Step 1: start enrolment (get secret + otpauth URL)
document.getElementById('startTotpBtn').onclick = async () => {
  const access = getAccessToken();
  if (!access) { alert('Please sign in via Google/Cognito first'); return; }
  try {
    const assoc = await postJSON('/auth/mfa/associate_loggedin', { access_token: access });
    document.getElementById('mfaStep1').style.display = 'none';
    document.getElementById('mfaStep2').style.display = '';
    document.getElementById('mfaOtpauth').textContent = assoc.otpauth_url;
    document.getElementById('mfaQr').src =
      'https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=' + encodeURIComponent(assoc.otpauth_url);
    document.getElementById('mfaMsg').textContent = 'Scan the QR, then enter the 6-digit code.';
  } catch(e){
    alert('Associate failed: ' + e.message);
  }
};

// Step 2: verify 6-digit and enable MFA
document.getElementById('verifyTotpBtn').onclick = async () => {
  const access = getAccessToken();
  const code = (document.getElementById('mfaCode').value || '').trim();
  if (!/^\d{6}$/.test(code)) { alert('Enter the 6-digit code'); return; }
  try {
    await postJSON('/auth/mfa/verify_loggedin', { access_token: access, code });
    document.getElementById('mfaMsg').textContent = '✅ TOTP enabled. Next logins can use MFA.';
    alert('MFA enabled for this user!');
  } catch(e){
    alert('Verify/enable failed: ' + e.message);
  }
};

    // --- JWT helpers ---
function parseJwt(token) {
  if (!token) return null;
  const parts = token.split('.');
  if (parts.length !== 3) return null;
  // base64url → base64
  const base64 = parts[1].replace(/-/g, '+').replace(/_/g, '/');
  try {
    const json = decodeURIComponent(
      atob(base64)
        .split('')
        .map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2))
        .join('')
    );
    return JSON.parse(json);
  } catch {
    return null;
  }
}

function getIdToken() {
  return localStorage.getItem('jwt') || '';
}

function getClaims() {
  return parseJwt(getIdToken()) || {};
}

function userGroups() {
  const claims = getClaims();
  // Cognito sets "cognito:groups" when present
  return claims['cognito:groups'] || [];
}

function isAdmin() {
  return userGroups().includes('Admin');
}

// --- Wire up UI based on group ---
(function setupAdminUi(){
  const adminPanel = document.getElementById('adminPanel');
  if (!adminPanel) return;

  if (isAdmin()) {
    adminPanel.style.display = '';
    // Example click handlers:
    document.getElementById('reindexBtn').onclick  = () => alert('Re-index kicked (demo)');
    document.getElementById('purgeBtn').onclick    = () => alert('Purge kicked (demo)');
  } else {
    adminPanel.style.display = 'none';
  }
})();

// (Optional) show auth state string with group info
(function showAuthState(){
  const el = document.getElementById('authStatus');
  if (!el) return;
  const claims = getClaims();
  const groups = userGroups();
  if (getIdToken()) {
    el.textContent = `Logged in • groups: ${groups.join(', ') || '(none)'}`;
  } else {
    el.textContent = 'Logged out';
  }
})();
  </script>
</body>
</html>
